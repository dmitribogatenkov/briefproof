name: check

# `claude plugin update` pulls straight from main, so every push is checked
# before anyone updates: the manifest validates and the mod's tests pass.
# The eval suite under evals/ calls the model and costs money; run it by hand
# (see README, Contributing) when a skill changes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin
        run: claude plugin validate --strict .
      - name: Run the mod's tests
        run: claude plugin test .
